name: validate
on:
  push:
    branches-ignore: ['gh-readonly-queue/**'] # the merge queue's own branches run as merge_group
    tags: ['**'] # a branch filter alone would stop tag pushes from running
  pull_request:
  merge_group:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a full commit SHA: a tag can be moved to other code. Dependabot updates the pin.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false # nothing later needs the token
      - name: JSON syntax
        run: |
          for f in azuredeploy.json createUiDefinition.json; do jq empty "$f"; done
      - name: Scrub check tests
        run: bash scripts/scrub-check-test.sh
      # The internal-name list is a secret, given only to the two steps that need it. Pull requests
      # from forks get no secrets, so only they may run without it. The merge queue runs with it,
      # on the exact commit that would land on main, so a fork's change is checked before it merges.
      - name: Scrub check (nothing internal, no keys or IDs)
        env:
          SCRUB_INTERNAL_RE: ${{ secrets.SCRUB_INTERNAL_RE }}
          SCRUB_ALLOW_NO_INTERNAL: ${{ github.event.pull_request.head.repo.fork && '1' || '0' }}
        run: bash scripts/scrub-check.sh
      - name: Release gate and history
        env:
          SCRUB_INTERNAL_RE: ${{ secrets.SCRUB_INTERNAL_RE }}
          SCRUB_ALLOW_NO_INTERNAL: ${{ github.event.pull_request.head.repo.fork && '1' || '0' }}
        run: bash scripts/scrub-check.sh --release --history
